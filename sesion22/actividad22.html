<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- <link href="style.css" rel="stylesheet"> -->
</head>
<body>
    <div class="card m-3" id="card" style="width: 20rem;">
        <div class="card-header">
            <h5 class="card-title">Card title</h5>
        </div>
        <img id="imagen" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDxvdzY4zO7Bovv4Tp4vHYCm9pcKezicwD5sJg7TFRwPA-wlQRASeAUUvV&s=10" class="card-img-top" alt="Perrito">
        <div class="card-body">
            <p class="card-text" id="texto">Some quick example text to build on the card title and make up the bulk of the card's
                content.</p>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <button class="btn btn-success" type="button" id="btnAgregar">Agregar</button>
            <button class="btn btn-danger" type="button" id="btnEliminar">Eliminar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
