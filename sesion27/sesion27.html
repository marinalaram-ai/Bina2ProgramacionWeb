<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pokémon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!--Verifica si tienes un contenedor <ul class="list-group"> en tu HTML con el ID pokemon-list.-->
    <div class="container mt-4">
        <h1 class="mb-4">Lista de Pokémon</h1>

        <!-- Buscador -->
        <div class="input-group mb-3">
            <input type="text" id="search-input" class="form-control" placeholder="Buscar Pokémon por nombre">
            <button id="search-button" class="btn btn-primary">Buscar</button>
        </div>

        <ul class="list-group" id="pokemon-list"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
