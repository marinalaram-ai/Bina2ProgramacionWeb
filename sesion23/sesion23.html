<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de imágenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-3">
        <form id="formulario" class="row justify-content-center">
            <div class="col-6">
                <input type="text" class="form-control" id="inputTexto" placeholder="inserta url de imagen">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" type="submit" id="btnInsertar">Insertar</button>
            </div>
        </form>
        <p class="text-danger text-center mt-2" id="mensaje"></p>

        <div class="d-flex flex-wrap justify-content-center gap-3" id="contenedor">

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
