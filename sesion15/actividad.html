<!DOCTYPE html>
<html>

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

        <style>
            .menu{ background-color: #7dc67a; }
            .header{ background-color: #f29230; }
            .profile{ background-color: #e57373; }
            .mainBody{ background-color: #4fc0e3; }
            .footer{ background-color: #9f86de; }
            .alto{ height: 350px; }
        </style>
</head>

<body>
    <div class="container">
        <div class="row d-flex align-items-center mb-3">
            <div class="col">
                <div class="d-flex justify-content-center menu rounded shadow p-2">Menu Bar</div>
            </div>
        </div>
        <div class="row d-flex align-items-center mb-3">
            <div class="col">
                <div class="d-flex justify-content-center header rounded shadow p-2">Header</div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-4">
                <div class="d-flex justify-content-center profile rounded shadow p-2 alto">Profile</div>
            </div>
            <div class="col-8">
                <div class="d-flex justify-content-center mainBody rounded shadow p-2 alto">Main Body</div>
            </div>
        </div>
        <div class="row d-flex align-items-center mb-3">
            <div class="col">
                <div class="d-flex justify-content-center footer rounded shadow p-2">Footer</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
