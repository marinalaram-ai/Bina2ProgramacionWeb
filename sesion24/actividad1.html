<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
     <!-- Contenido de la página -->
    <div class="container mt-4">
        <h1 class="mb-4">Lista de tareas</h1>

        <ul id="listaTareas" class="list-group mb-3">
            <li id="tarea1" class="list-group-item">Comprar ingredientes</li>
            <li id="tarea2" class="list-group-item">Preparar el menú del día</li>
            <li id="tarea3" class="list-group-item">Limpiar el comedor</li>
        </ul>

        <button id="btnEliminarPrimero" class="btn btn-danger mb-4" type="button">Eliminar primera tarea</button>

        <div class="input-group mb-4">
            <input type="text" id="inputNuevaTarea" class="form-control" placeholder="Nueva tarea">
            <button id="btnAgregarTarea" class="btn btn-primary" type="button">Agregar tarea</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
